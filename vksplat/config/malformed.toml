[window]
width = 1600
height = 900
title = "vksplat"
vsync = true

[renderer]
validation = true
preferred_device = ""
frames_in_flight = 2
clear_color = [0.02, 0.03, 0.05, 1.0]
log_statistics = true
splat_extent_sigma = 3.0
resolution_scale = 1.5

[stereo]
enabled = true
interpupillary_distance = 0.065

[tonemap]
exposure = 1.0
operator = "aces"

[camera]
field_of_view_degrees = 55.0
near_plane = 0.01
far_plane = 500.0
orbit_degrees_per_second = 12.0
elevation_degrees = 18.0
distance_multiplier = 2.4

[scene]
path = "assets/test_galaxy.ply"
